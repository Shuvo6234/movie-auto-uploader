name: Daily Movie Uploader

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

concurrency:
  group: daily-movie-uploader
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:

      # ----------------------------------------
      # 1. Checkout repository
      # ----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------
      # 2. Setup Python
      # ----------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ----------------------------------------
      # 3. Install dependencies
      # ----------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ----------------------------------------
      # 4. Test Google Drive folder access
      # ----------------------------------------
      - name: Test Google Drive folder access
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}

        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          SCOPES = [
    "https://www.googleapis.com/auth/drive"
]

          print("Connecting to Google Drive...")

          credentials = Credentials(
              token=None,
              refresh_token=os.environ["GOOGLE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["GOOGLE_CLIENT_ID"],
              client_secret=os.environ["GOOGLE_CLIENT_SECRET"],
              scopes=SCOPES,
          )

          service = build(
              "drive",
              "v3",
              credentials=credentials,
          )

          folder_id = os.environ["GOOGLE_DRIVE_FOLDER_ID"]

          print("Checking target folder...")

          folder = (
              service.files()
              .get(
                  fileId=folder_id,
                  fields="id,name,mimeType",
              )
              .execute()
          )

          print(f"Folder ID: {folder['id']}")
          print(f"Folder name: {folder['name']}")
          print(f"Folder type: {folder['mimeType']}")

          if folder["mimeType"] != "application/vnd.google-apps.folder":
              raise RuntimeError(
                  "GOOGLE_DRIVE_FOLDER_ID is not a folder."
              )

          print("Folder access: OK")

          # Create tiny temporary test file
          test_file = Path("drive_access_test.txt")

          test_file.write_text(
              "Google Drive access test",
              encoding="utf-8",
          )

          metadata = {
              "name": "drive_access_test.txt",
              "parents": [folder_id],
          }

          media = MediaFileUpload(
              str(test_file),
              mimetype="text/plain",
          )

          print("Testing upload permission...")

          result = (
              service.files()
              .create(
                  body=metadata,
                  media_body=media,
                  fields="id,name,parents",
              )
              .execute()
          )

          test_file_id = result["id"]

          print("Upload permission: OK")
          print(f"Temporary test file ID: {test_file_id}")

          print("Deleting temporary test file...")

          service.files().delete(
              fileId=test_file_id
          ).execute()

          test_file.unlink(missing_ok=True)

          print("Temporary test file deleted.")
          print("Google Drive test completed successfully.")
          PY

      # ----------------------------------------
      # 5. Run movie uploader
      # ----------------------------------------
      - name: Run movie uploader
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}

        run: |
          python src/main.py

      # ----------------------------------------
      # 6. Save permanent database
      # ----------------------------------------
      - name: Save database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/downloaded.json

          if git diff --cached --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "Update movie upload database"
            git push
          fi
